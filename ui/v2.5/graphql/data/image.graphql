fragment ImageData on Image {
  id
  title
  code
  rating100
  date
  urls
  details
  photographer
  organized
  performer_assignment_lock
  studio_assignment_lock
  tag_assignment_lock
  o_counter
  created_at
  updated_at

  paths {
    thumbnail
    preview
    image
  }

  galleries {
    ...GalleryData
  }

  studio {
    ...SlimStudioData
  }

  tags {
    ...SlimTagData
  }

  performers {
    ...PerformerData
  }

  visual_files {
    ...VisualFileData
  }

  custom_fields
}
